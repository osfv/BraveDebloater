<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BraveDebloater: remove Brave Browser extras with official policies</title>
    <meta
      name="description"
      content="Turn off Brave Rewards, Wallet, VPN, Leo and telemetry with Brave's own enterprise policies. The tool previews first and backs up before it writes."
    />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:title" content="BraveDebloater" />
    <meta
      property="og:description"
      content="Turn off Brave Rewards, Wallet, VPN, Leo and telemetry with Brave's own enterprise policies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bravedebloater.tersa.tech/" />
    <link rel="canonical" href="https://bravedebloater.tersa.tech/" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preload" as="image" href="./media/brave-stock.webp" fetchpriority="high" />
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
